# Production-like stack: only the frontend is published. The browser talks to Next.js, which proxies /api/* to Django.
# Usage:  cp .env.example .env   (fill in the secrets)   then   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-innovation}
      POSTGRES_USER: ${DB_USER:-innovation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-innovation} -d ${DB_NAME:-innovation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: ${DB_NAME:-innovation}
      DB_USER: ${DB_USER:-innovation}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}   # TLS ends at your reverse proxy; set 1 only if Django sees HTTPS
      SECURE_PROXY_SSL: ${SECURE_PROXY_SSL:-0}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Amman}
    volumes: [media:/data/private_media]
    depends_on:
      db: {condition: service_healthy}
    expose: ["8000"]   # not published to the host
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request as u; r=u.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip()}); sys.exit(0 if u.urlopen(r, timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
  media:
