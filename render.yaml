# Render Blueprint (FREE plan version): PostgreSQL + Django API + Next.js web app. See docs/DEPLOYMENT.md, section 7.
# Free-plan limits, accepted here for a demo/test deployment:
#   - No persistent disk: uploaded files are lost on every deploy/restart.
#   - No background worker: the scheduler (reminders, 60-minute urgent alerts) is NOT running.
#   - Free web services sleep after ~15 minutes without traffic (about a minute to wake).
#   - The free PostgreSQL database expires after 30 days. Do not keep real data in it.
#   - No Shell on free instances, so the first accounts are created at start-up from the variables below.
# Every service sits in one region, because Render's private network (the internal names below) only works inside a region.
# Values marked `sync: false` are asked for in the dashboard when the Blueprint is first applied; nothing secret is written here.
databases:
  - name: innovation-hr-db
    databaseName: innovation
    user: innovation
    plan: free
    postgresMajorVersion: "16"
    region: frankfurt
    ipAllowList: []   # reachable only from services inside Render's private network

services:
  # Django API. Free plan has no private services, so this is a web service; the web app still calls it by its internal name.
  - type: web
    name: innovation-hr-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Same as the Dockerfile's CMD, plus creating the first accounts (seed does nothing if the CEO already exists;
    # createsuperuser is allowed to fail when the admin already exists).
    dockerCommand: sh -c "python manage.py migrate --noinput && python manage.py seed && (python manage.py createsuperuser --noinput --email \"$ADMIN_EMAIL\" --full_name \"$ADMIN_NAME\" || true) && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    plan: free
    region: frankfurt
    envVars:
      - {key: PORT, value: "8000"}   # the Dockerfile's gunicorn listens on 8000
      - {key: PRIVATE_MEDIA_ROOT, value: /data/private_media}   # no disk on the free plan: files here are temporary
      - {key: DJANGO_SECRET_KEY, sync: false}   # 50+ random characters; Render's own generator is too short for production.py
      - {key: DJANGO_ALLOWED_HOSTS, value: innovation-hr-api}   # the internal name the web app calls (the service name above)
      - {key: CORS_ALLOWED_ORIGINS, sync: false}   # the web app's public https address, e.g. https://innovation-hr-web.onrender.com
      - {key: SECURE_PROXY_SSL, value: "1"}
      - {key: TRUSTED_PROXY_COUNT, value: "1"}
      - {key: SECURE_SSL_REDIRECT, value: "0"}   # the web app calls this service over plain http on the private network; TLS ends at Render's edge
      - {key: DJANGO_TIME_ZONE, value: Asia/Amman}
      - {key: DB_ENGINE, value: postgres}
      - {key: DB_HOST, fromDatabase: {name: innovation-hr-db, property: host}}
      - {key: DB_PORT, fromDatabase: {name: innovation-hr-db, property: port}}
      - {key: DB_NAME, fromDatabase: {name: innovation-hr-db, property: database}}
      - {key: DB_USER, fromDatabase: {name: innovation-hr-db, property: user}}
      - {key: DB_PASSWORD, fromDatabase: {name: innovation-hr-db, property: password}}
      - {key: PORTAL_URL, sync: false}   # e.g. https://innovation-hr-web.onrender.com/portal
      - {key: DJANGO_EMAIL_BACKEND, value: django.core.mail.backends.smtp.EmailBackend}
      - {key: EMAIL_HOST, sync: false}
      - {key: EMAIL_HOST_USER, sync: false}
      - {key: EMAIL_HOST_PASSWORD, sync: false}
      - {key: DEFAULT_FROM_EMAIL, sync: false}
      # First accounts, created at start-up (no Shell on the free plan). Change both passwords after the first sign-in.
      - {key: CEO_EMAIL, sync: false}
      - {key: CEO_PASSWORD, sync: false}
      - {key: CEO_NAME, sync: false}
      - {key: ADMIN_EMAIL, sync: false}
      - {key: ADMIN_NAME, sync: false}
      - {key: DJANGO_SUPERUSER_PASSWORD, sync: false}

  # Next.js web app: the address people use. It forwards /api/* to the API by its internal name.
  - type: web
    name: innovation-hr-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: frankfurt
    healthCheckPath: /login
    envVars:
      - {key: BACKEND_URL, value: "http://innovation-hr-api:8000"}

  # The scheduler worker (innovation-hr-scheduler) is removed: background workers are not available on the free plan.
  # To get reminders and urgent alerts back, restore it from git history on a paid plan.
